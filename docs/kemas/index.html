<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEMAS APPAREL</title>
<meta name="description" content="Job board for KEMAS APPAREL shirt projects: stages, quantities, sales and profit.">
<meta name="theme-color" content="#1d3fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KEMAS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a print-shop job board. Sticky header, money strip, then Board / Jobs / Money views. Job cards read like order tickets. */
:root {
  --paper: #f3f4f7;
  --surface: #ffffff;
  --sunk: #eceef3;
  --ink: #15171d;
  --muted: #5c6371;
  --line: #dcdfe6;
  --accent: #1d3fd0;
  --accent-ink: #ffffff;
  --ok: #18804a;
  --warn: #a96200;
  --bad: #c0302a;
  --s-design: #6a49e0;
  --s-client: #c47f00;
  --s-print: #0a87a0;
  --s-ready: #23924f;
  --s-done: #6b7280;
  --s-hold: #b13d2e;
  --shadow: 0 1px 2px rgba(20,24,40,.06), 0 4px 14px rgba(20,24,40,.06);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1115; --surface: #171a21; --sunk: #1e222b; --ink: #eceef3; --muted: #9ba2b0; --line: #2a2f3a;
  --accent: #7590ff; --accent-ink: #0b0e16; --ok: #4cc683; --warn: #f0a83a; --bad: #ff6b5f;
  --s-design: #9b83ff; --s-client: #f0b23e; --s-print: #3cc4dd; --s-ready: #52cf85; --s-done: #9aa1ad; --s-hold: #ff7a66;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0f1115; --surface: #171a21; --sunk: #1e222b; --ink: #eceef3; --muted: #9ba2b0; --line: #2a2f3a;
  --accent: #7590ff; --accent-ink: #0b0e16; --ok: #4cc683; --warn: #f0a83a; --bad: #ff6b5f;
  --s-design: #9b83ff; --s-client: #f0b23e; --s-print: #3cc4dd; --s-ready: #52cf85; --s-done: #9aa1ad; --s-hold: #ff7a66;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: 22px; letter-spacing: .02em; line-height: 1; }
.brand span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 9px; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.small { padding: 5px 10px; font-size: 13px; }

.sync-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 7px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.sync-chip:hover { border-color: var(--muted); }
.sync-chip .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--muted); flex: none; }
.sync-chip[data-s="ok"] .dot { background: var(--ok); }
.sync-chip[data-s="syncing"] .dot { background: var(--accent); }
.sync-chip[data-s="offline"] .dot, .sync-chip[data-s="error"] .dot { background: var(--warn); }
.sync-chip[data-s="error"] { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
@media (prefers-reduced-motion: no-preference) { .sync-chip[data-s="syncing"] .dot { animation: pulse 1s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .3; } }
.short { display: none; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.steps li { padding-left: 4px; }
.steps a { color: var(--accent); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.banner { margin-top: 14px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); font-size: 14px; color: var(--muted); }
.banner[data-tone="warn"] { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--ink); }

/* strip */
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 18px; }
.stat { background: var(--surface); padding: 14px 16px; min-width: 0; }
.stat .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.stat .v.pos { color: var(--ok); } .stat .v.neg { color: var(--bad); }
@media (max-width: 900px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip .stat:first-child { grid-column: 1 / -1; } }

main { padding-block: 0 64px; }
.viewhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
.viewhead h2 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: 20px; text-wrap: balance; }
.viewhead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

/* board */
.board-scroll { overflow-x: auto; padding-bottom: 6px; }
.board { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(240px, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 720px) { .board-scroll { overflow: visible; } .board { grid-template-columns: 1fr; } }
.col { background: var(--sunk); border-radius: 10px; padding: 10px; min-width: 0; }
.colhead { display: flex; align-items: center; gap: 8px; padding: 4px 4px 10px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.colhead h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.colhead .n { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.colhead .hint { display: block; font-size: 12px; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.empty-col { font-size: 13px; color: var(--muted); padding: 14px 8px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; box-shadow: var(--shadow); cursor: pointer; }
.card:hover { border-color: var(--muted); border-left-color: var(--c); }
.card .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .code { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.card .name { font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.card .client { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); font-weight: 600; }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); font-weight: 600; }
.chip.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.card .next { align-self: flex-start; margin-top: 2px; border: 0; background: transparent; padding: 2px 0; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.card .next:hover { text-decoration: underline; }

/* pill */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 99px; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); }

/* tables */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; }
.filter { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunk); }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .t1 { font-weight: 600; } td .t2 { font-size: 12.5px; color: var(--muted); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }

/* money */
.money-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 900px) { .money-grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
.panel .lede { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.owe { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.owe li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.owe li:last-child { border-bottom: 0; }
.owe .amt { font-family: var(--f-mono); font-weight: 600; color: var(--warn); white-space: nowrap; }
.settings-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 18px; font-size: 14px; color: var(--muted); }
.settings-row input { width: 90px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10,12,20,.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 32px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); width: 100%; max-width: 760px; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: 19px; }
.sheet-head .code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.sheet-head .x { margin-left: auto; border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); border-radius: 6px; }
.sheet-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 20px; }
.sheet-foot { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--sunk); flex-wrap: wrap; }
.sheet-foot .spacer { flex: 1; }
@media (max-width: 560px) { .scrim { padding: env(safe-area-inset-top, 0px) 0 0; } .sheet { border-radius: 0; min-height: 100%; } }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .grid2, .grid4 { grid-template-columns: 1fr 1fr; } .grid2 .full-sm { grid-column: 1 / -1; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; }
.field .help { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.field textarea { min-height: 80px; resize: vertical; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; }
.stages button { border: 1px solid var(--line); background: var(--paper); padding: 6px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.stages button::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.stages button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--ink); }
.sizes { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 640px) { .sizes { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.size label.big { color: var(--warn); }
.line-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); min-width: 0; }
.line-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.line-head b { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.line-head input { flex: 1 1 140px; min-width: 0; }
.inp { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); width: 100%; min-width: 0; }
.line-box .field input, .line-box .field select, .line-box .size input { background: var(--surface); }
.sub-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
.toggle small { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; margin-left: 3px; }
.toggle[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--ink); }
.line-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.line-sum b { color: var(--ink); font-weight: 600; }
.linkbtn { border: 0; background: transparent; padding: 4px 2px; color: var(--accent); font-weight: 600; font-size: 13px; }
.linkbtn.danger { color: var(--bad); }
.lines { display: flex; flex-direction: column; gap: 10px; }
.pl-sec { display: flex; flex-direction: column; gap: 6px; }
.pl-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 34px; gap: 6px; align-items: center; }
.pl-row.has-note { grid-template-columns: minmax(0, 1fr) minmax(0, .7fr) 96px 34px; }
.pl-row .x2 { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 4px; border-radius: 6px; }
.pl-row .x2:hover { color: var(--bad); }
.pl-head { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.share-row { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 560px) { .line-box .grid2 { grid-template-columns: 1fr; } .line-box { padding: 10px; } }
.size { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
.size label { font-family: var(--f-mono); font-size: 12px; font-weight: 600; text-align: center; color: var(--muted); }
.size input { text-align: center; padding: 7px 4px; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); font-family: var(--f-mono); width: 100%; }
.calc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
@media (max-width: 560px) { .calc { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.calc div { background: var(--sunk); padding: 9px 11px; min-width: 0; }
.calc .k { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.calc .v { font-family: var(--f-mono); font-weight: 600; font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.history li { display: flex; gap: 10px; align-items: center; }
.history time { font-family: var(--f-mono); color: var(--muted); font-size: 12px; min-width: 96px; }
.err { color: var(--bad); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 80; box-shadow: var(--shadow); }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.empty-state { text-align: center; padding: 48px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty-state h3 { margin: 0 0 6px; font-family: var(--f-display); font-stretch: 110%; font-size: 20px; }
.empty-state p { margin: 0 auto 16px; color: var(--muted); max-width: 46ch; }
@media (prefers-reduced-motion: no-preference) { .card, .btn, .filter { transition: border-color .15s, background .15s, filter .15s; } }
html { -webkit-text-size-adjust: 100%; } * { -webkit-tap-highlight-color: transparent; }
@media (max-width: 720px), (pointer: coarse) { input, select, textarea { font-size: 16px !important; } .card .next { padding: 8px 0; } .btn { min-height: 40px; } }
@media (max-width: 560px) { .long { display: none; } .short { display: inline; } .sync-chip { padding: 6px 9px; } .brand span { display: none; } .brand b { font-size: 17px; font-stretch: 100%; letter-spacing: 0; } .brand { min-width: 0; } #new-btn { padding: 7px 11px; } header.top .wrap { gap: 10px; padding-block: 10px; } .tabs { order: 3; width: 100%; } .tabs button { flex: 1; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>KEMAS APPAREL</b><span>Job board</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button id="tab-board" role="tab" data-tab="board" aria-selected="true">Board</button>
      <button id="tab-jobs" role="tab" data-tab="jobs" aria-selected="false">All jobs</button>
      <button id="tab-money" role="tab" data-tab="money" aria-selected="false">Money</button>
    </nav>
    <button class="sync-chip" id="sync-btn" type="button" data-s="off" aria-label="Sync between devices"><span class="dot"></span><span id="sync-text">Connect sync</span></button>
    <button class="btn primary" id="new-btn" type="button">+ <span class="long">New project</span><span class="short">New</span></button>
  </div>
</header>

<div class="wrap">
  <div id="banner" hidden></div>
  <section class="strip" id="strip" aria-label="Summary"></section>
  <main id="view"><div class="loading">Loading your projects…</div></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  const STAGES = [
    { id: "design", label: "Designing", hint: "Working on the artwork", c: "--s-design", next: "Waiting on client" },
    { id: "client", label: "Waiting on client", hint: "Approval or final quantity", c: "--s-client", next: "At the printer" },
    { id: "print", label: "At the printer", hint: "Design sent, being printed", c: "--s-print", next: "Ready to deliver" },
    { id: "ready", label: "Ready to deliver", hint: "Printed, waiting for pickup", c: "--s-ready", next: "Delivered" },
    { id: "done", label: "Delivered", hint: "Handed over", c: "--s-done", next: null },
  ];
  const HOLD = { id: "hold", label: "On hold", hint: "Paused", c: "--s-hold", next: null };
  const ALL = [...STAGES, HOLD];
  const stageOf = id => ALL.find(s => s.id === id) || STAGES[0];
  const SIZES = ["XS", "S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
  const DEFAULT_PL = {
    base: "",
    fabrics: [
      { id: "mini-eyelet", name: "Mini Eyelet", note: "160 gsm", price: 0 },
      { id: "interlock", name: "Interlock", note: "160 gsm", price: 0 },
      { id: "eyelet", name: "Eyelet", note: "160 gsm", price: 0 },
      { id: "diamond", name: "Diamond", note: "150–155 gsm", price: 2 },
      { id: "sparkling-eyelet", name: "Sparkling Eyelet", note: "160 gsm", price: 2 },
      { id: "rjpk", name: "RJPK", note: "175 gsm", price: 2 },
      { id: "mini-square", name: "Mini Square", note: "120 gsm", price: 2 },
      { id: "premium-mini-square", name: "Premium Mini Square", note: "120 gsm", price: 2 },
      { id: "ultron", name: "Ultron", note: "140 gsm", price: 2 },
      { id: "lycra-220", name: "Lycra", note: "220 gsm", price: 4 },
      { id: "lycra-260", name: "Lycra", note: "260 gsm", price: 6 },
      { id: "lycra-280", name: "Lycra", note: "280 gsm", price: 10 },
    ],
    collars: [
      { id: "round", name: "Round neck", price: 0 },
      { id: "vneck", name: "V-neck", price: 1 },
      { id: "polo", name: "Polo", price: 3 },
      { id: "nfl", name: "NFL", price: 4 },
      { id: "retro", name: "Retro", price: 5 },
      { id: "mandarin", name: "Mandarin", price: 5 },
    ],
    sleeves: [
      { id: "normal", name: "Normal sleeve", price: 0 },
      { id: "raglan-round", name: "Raglan round neck", price: 3 },
      { id: "raglan-collar", name: "Raglan collar", price: 5 },
    ],
    addons: [
      { id: "muslimah", name: "Muslimah", price: 8 },
      { id: "oversize", name: "Oversize", price: 8 },
      { id: "backtape", name: "Backtape with printing", price: 2 },
      { id: "numbering", name: "Numbering or naming", price: 3 },
      { id: "dtf-label", name: "DTF label tag", price: 1 },
      { id: "pen-pocket", name: "Pen pocket", price: 2 },
    ],
    bigFrom: "3XL", big: 4,
  };
  const clone = o => JSON.parse(JSON.stringify(o));
  const pick = (list, id) => (list || []).find(x => x.id === id) || (list || [])[0] || { id: "", name: "", price: 0 };
  const plus = n => (num(n) ? "+" + money(num(n)).replace(state.currency + " ", state.currency) : "free");
  const fabricLabel = f => f.name + (f.note ? ` · ${f.note}` : "");
  const newLine = pl => ({ id: "l" + Math.random().toString(36).slice(2, 8), label: "", collar: pl.collars[0] ? pl.collars[0].id : "", sleeve: pl.sleeves[0] ? pl.sleeves[0].id : "", addons: [], sizes: {}, pieces: "" });
  const bigIdx = pl => { const i = SIZES.indexOf(pl.bigFrom || "3XL"); return i < 0 ? SIZES.length : i; };
  function unitOf(p, line) {
    const pl = p.pl || state.priceList;
    return num(p.base) + num(pick(pl.fabrics, p.fabric).price) + num(pick(pl.collars, line.collar).price) + num(pick(pl.sleeves, line.sleeve).price)
      + (line.addons || []).reduce((a, id) => a + num(((pl.addons || []).find(x => x.id === id) || {}).price), 0);
  }
  function lineCalc(p, line) {
    const pl = p.pl || state.priceList, bi = bigIdx(pl), unit = unitOf(p, line);
    const sizes = line.sizes || {};
    let pcs = 0, bigPcs = 0;
    SIZES.forEach((k, i) => { const n = num(sizes[k]); pcs += n; if (i >= bi) bigPcs += n; });
    const bySize = pcs > 0;
    if (!bySize) pcs = num(line.pieces);
    return { unit, bigUnit: unit + num(pl.big), pcs, bigPcs, bySize, sale: pcs * unit + bigPcs * num(pl.big) };
  }
  const hasLines = p => Array.isArray(p.lines) && p.lines.length > 0;

  const state = { projects: [], deleted: {}, currencyAt: "", priceList: null, priceListAt: "", currency: "RM", tab: "board", q: "", stageFilter: "active", mode: "loading", loaded: false };

  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const money = n => { const neg = n < 0; n = Math.abs(n); const s = n.toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); return (neg ? "−" : "") + state.currency + " " + s; };
  const qtyOf = p => { if (hasLines(p)) return p.lines.reduce((a, l) => a + lineCalc(p, l).pcs, 0); const s = SIZES.reduce((a, k) => a + num(p.sizes && p.sizes[k]), 0); return s > 0 ? s : num(p.qty); };
  const calc = p => {
    const q = qtyOf(p);
    const sale = hasLines(p) ? p.lines.reduce((a, l) => a + lineCalc(p, l).sale, 0) + num(p.adjust) : q * num(p.price);
    const cost = q * num(p.cost) + num(p.extra);
    return { q, sale, cost, profit: sale - cost, paid: num(p.paid), balance: sale - num(p.paid) };
  };
  const avgPrice = p => { const c = calc(p); return c.q ? c.sale / c.q : num(p.price); };
  function specLine(p) {
    if (!hasLines(p)) return p.shirt || "";
    const pl = p.pl || state.priceList;
    const collars = [...new Set(p.lines.map(l => pick(pl.collars, l.collar).name))].join(", ");
    return [p.fabric ? pick(pl.fabrics, p.fabric).name : "", collars].filter(Boolean).join(" · ");
  }
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const parseDay = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return y ? new Date(y, m - 1, d) : null; };
  const fmtDay = s => { const d = parseDay(s); return d ? d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) : ""; };
  const fmtStamp = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); };
  const dueInfo = p => {
    if (!p.due || p.stage === "done") return null;
    const diff = Math.round((parseDay(p.due) - today()) / 86400000);
    if (diff < 0) return { cls: "bad", text: `Overdue ${-diff}d` };
    if (diff === 0) return { cls: "bad", text: "Due today" };
    if (diff <= 3) return { cls: "warn", text: `Due in ${diff}d` };
    return { cls: "", text: `Due ${fmtDay(p.due)}` };
  };
  const nextCode = () => { const max = state.projects.reduce((m, p) => Math.max(m, parseInt(String(p.code || "").replace(/\D/g, ""), 10) || 0), 0); return "KA-" + String(max + 1).padStart(4, "0"); };

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2200); }
  function banner(text, tone) { const b = $("#banner"); if (!text) { b.hidden = true; return; } b.className = "banner"; b.dataset.tone = tone || ""; b.textContent = text; b.hidden = false; }

  /* ---------- data ---------- */
  const KEY = "kemas-apparel-v1";
  function persistLocal() {
    try { localStorage.setItem(KEY, JSON.stringify({ projects: state.projects, deleted: state.deleted, currency: state.currency, currencyAt: state.currencyAt, priceList: state.priceList, priceListAt: state.priceListAt, savedAt: new Date().toISOString() })); }
    catch (e) { const err = new Error("save failed"); err.code = "quota_exceeded"; throw err; }
  }
  function persist() { persistLocal(); scheduleSync(); }
  async function saveProject(id, data) {
    data.updatedAt = new Date().toISOString();
    const before = state.projects.slice();
    const i = state.projects.findIndex(p => p.id === id);
    if (i >= 0) state.projects[i] = { ...data, id }; else state.projects.push({ ...data, id: id || "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) });
    try { persist(); } catch (e) { state.projects = before; throw e; }
    render();
  }
  async function deleteProject(id) {
    state.projects = state.projects.filter(p => p.id !== id); state.deleted[id] = new Date().toISOString(); persist(); render();
  }
  function exportBackup() {
    const blob = new Blob([JSON.stringify({ app: "kemas-apparel", version: 1, exportedAt: new Date().toISOString(), currency: state.currency, priceList: state.priceList, priceListAt: state.priceListAt, projects: state.projects }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `kemas-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Backup saved");
  }
  async function importBackup(file) {
    try {
      const d = JSON.parse(await file.text());
      if (!d || !Array.isArray(d.projects)) throw new Error("bad");
      const byId = new Map(state.projects.map(p => [p.id, p]));
      d.projects.forEach(p => { if (p && typeof p === "object") { const id = String(p.id || "p-" + Math.random().toString(36).slice(2)); const old = byId.get(id); if (!old || String(p.updatedAt) >= String(old.updatedAt)) byId.set(id, { ...p, id }); } });
      state.projects = [...byId.values()];
      if (d.priceList && String(d.priceListAt || "") > String(state.priceListAt || "")) { state.priceList = d.priceList; state.priceListAt = d.priceListAt; }
      if (d.currency) { state.currency = String(d.currency).slice(0, 5); state.currencyAt = new Date().toISOString(); }
      persist(); render(); toast(`Imported ${d.projects.length} project${d.projects.length === 1 ? "" : "s"}`);
    } catch (_) { toast("That file isn't a KEMAS backup."); }
  }
  async function moveStage(p, stageId) {
    const { id, ...rest } = p;
    const history = [...(p.history || []), { stage: stageId, at: new Date().toISOString() }];
    await saveProject(id, { ...rest, stage: stageId, history });
    toast(`${p.code || "Project"} moved to ${stageOf(stageId).label}`);
  }

  /* ---------- summary strip ---------- */
  function renderStrip() {
    const ps = state.projects;
    const active = ps.filter(p => p.stage !== "done" && p.stage !== "hold");
    const pcsInWork = active.reduce((a, p) => a + qtyOf(p), 0);
    const late = active.filter(p => { const d = dueInfo(p); return d && d.cls === "bad"; }).length;
    const t = ps.reduce((a, p) => { const c = calc(p); a.sale += c.sale; a.profit += c.profit; a.bal += Math.max(0, c.balance); return a; }, { sale: 0, profit: 0, bal: 0 });
    const owing = ps.filter(p => calc(p).balance > 0).length;
    $("#strip").innerHTML = `
      <div class="stat"><div class="k">Active projects</div><div class="v">${active.length}</div><div class="sub">${late ? `<span class="neg">${late} overdue</span>` : "None overdue"} · ${ps.filter(p => p.stage === "done").length} delivered</div></div>
      <div class="stat"><div class="k">Shirts in progress</div><div class="v">${pcsInWork.toLocaleString()} <span style="font-size:15px;font-weight:600">pcs</span></div><div class="sub">${ps.filter(p => p.stage === "print").length} jobs at the printer</div></div>
      <div class="stat"><div class="k">Total sales</div><div class="v">${esc(money(t.sale))}</div><div class="sub">All projects booked</div></div>
      <div class="stat"><div class="k">Profit</div><div class="v ${t.profit >= 0 ? "pos" : "neg"}">${esc(money(t.profit))}</div><div class="sub">${t.sale ? Math.round(t.profit / t.sale * 100) + "% margin" : "No sales yet"}</div></div>
      <div class="stat"><div class="k">Still owed to you</div><div class="v">${esc(money(t.bal))}</div><div class="sub">${owing} client${owing === 1 ? "" : "s"} with balance</div></div>`;
  }

  /* ---------- board ---------- */
  function cardHTML(p) {
    const s = stageOf(p.stage), c = calc(p), d = dueInfo(p);
    const chips = [`<span class="chip">${c.q.toLocaleString()} pcs</span>`];
    if (d) chips.push(`<span class="chip ${d.cls}">${esc(d.text)}</span>`);
    if (c.sale > 0 && c.balance > 0) chips.push(`<span class="chip warn">Owes ${esc(money(c.balance))}</span>`);
    else if (c.sale > 0 && c.balance <= 0) chips.push(`<span class="chip ok">Paid</span>`);
    return `<article class="card" style="--c:var(${s.c})" data-open="${esc(p.id)}" tabindex="0" aria-label="${esc(p.name)}">
      <div class="row1"><span class="code">${esc(p.code)}</span>${p.printer && p.stage === "print" ? `<span class="code">@ ${esc(p.printer)}</span>` : ""}</div>
      <div class="name">${esc(p.name || "Untitled")}</div>
      ${p.client ? `<div class="client">${esc(p.client)}</div>` : ""}
      ${specLine(p) ? `<div class="client" style="font-size:12.5px">${esc(specLine(p))}</div>` : ""}
      <div class="chips">${chips.join("")}</div>
      ${s.next ? `<button class="next" type="button" data-advance="${esc(p.id)}">Next: ${esc(s.next)} →</button>` : ""}
    </article>`;
  }
  function sortForBoard(a, b) {
    const da = a.due ? parseDay(a.due).getTime() : Infinity, dbb = b.due ? parseDay(b.due).getTime() : Infinity;
    return da - dbb || String(a.code).localeCompare(String(b.code));
  }
  function renderBoard() {
    const ps = state.projects;
    const cols = [...STAGES];
    if (ps.some(p => p.stage === "hold")) cols.push(HOLD);
    const html = cols.map(s => {
      let items = ps.filter(p => (p.stage || "design") === s.id).sort(sortForBoard);
      let more = "";
      if (s.id === "done") { items = items.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))); if (items.length > 6) { more = `<div class="empty-col">+ ${items.length - 6} more in All jobs</div>`; items = items.slice(0, 6); } }
      const count = ps.filter(p => (p.stage || "design") === s.id).length;
      return `<section class="col" style="--c:var(${s.c})" aria-label="${esc(s.label)}">
        <div class="colhead"><span class="swatch"></span><h3>${esc(s.label)}<span class="hint">${esc(s.hint)}</span></h3><span class="n">${count}</span></div>
        <div class="cards">${items.map(cardHTML).join("") || `<div class="empty-col">Nothing here</div>`}${more}</div>
      </section>`;
    }).join("");
    return `<div class="viewhead"><div><h2>Where every job is</h2><p>Tap a card to edit it. Tap “Next” when a job moves forward.</p></div><button class="btn small" type="button" data-pricelist>Price list</button></div>
      <div class="board-scroll"><div class="board" style="--cols:${cols.length}">${html}</div></div>`;
  }

  /* ---------- all jobs ---------- */
  function renderJobs() {
    const q = state.q.trim().toLowerCase();
    const filters = [["active", "Active"], ["all", "All"], ...ALL.map(s => [s.id, s.label])];
    let rows = state.projects.filter(p => {
      if (state.stageFilter === "active" && (p.stage === "done" || p.stage === "hold")) return false;
      if (!["active", "all"].includes(state.stageFilter) && p.stage !== state.stageFilter) return false;
      if (q && ![p.code, p.name, p.client, p.contact, p.printer, p.shirt, p.notes].some(v => String(v || "").toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => String(b.code).localeCompare(String(a.code)));
    const tot = rows.reduce((a, p) => { const c = calc(p); a.q += c.q; a.sale += c.sale; a.bal += Math.max(0, c.balance); return a; }, { q: 0, sale: 0, bal: 0 });
    const body = rows.map(p => {
      const s = stageOf(p.stage), c = calc(p), d = dueInfo(p);
      return `<tr class="click" data-open="${esc(p.id)}" tabindex="0">
        <td class="mono" style="color:var(--muted);font-size:12.5px">${esc(p.code)}</td>
        <td><div class="t1">${esc(p.name || "Untitled")}</div><div class="t2">${esc(p.client || "—")}</div></td>
        <td><span class="pill" style="--c:var(${s.c})">${esc(s.label)}</span></td>
        <td class="num">${c.q.toLocaleString()}</td>
        <td>${d ? `<span class="chip ${d.cls}">${esc(d.text)}</span>` : `<span class="t2">${esc(fmtDay(p.due) || "—")}</span>`}</td>
        <td class="num">${esc(money(c.sale))}</td>
        <td class="num ${c.balance > 0 ? "neg" : ""}">${c.balance > 0 ? esc(money(c.balance)) : "Paid"}</td>
      </tr>`;
    }).join("");
    return `<div class="viewhead"><div><h2>All jobs</h2><p>${rows.length} shown. Search by project, client, printer or notes.</p></div></div>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search jobs…" value="${esc(state.q)}" aria-label="Search jobs">
        ${filters.map(([id, l]) => `<button class="filter" type="button" data-filter="${id}" aria-pressed="${state.stageFilter === id}">${esc(l)}</button>`).join("")}
      </div>
      ${rows.length ? `<div class="tablebox"><table>
        <thead><tr><th>Job</th><th>Project</th><th>Stage</th><th class="num">Pcs</th><th>Due</th><th class="num">Sale</th><th class="num">Balance</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td></td><td>Total</td><td></td><td class="num">${tot.q.toLocaleString()}</td><td></td><td class="num">${esc(money(tot.sale))}</td><td class="num">${esc(money(tot.bal))}</td></tr></tfoot>
      </table></div>` : `<div class="empty-state"><h3>No jobs match</h3><p>Try another search or pick a different stage.</p></div>`}`;
  }

  /* ---------- money ---------- */
  function monthKey(p) { const s = p.createdAt || p.updatedAt; return s ? s.slice(0, 7) : null; }
  function chartSVG(months) {
    const W = 640, H = 230, L = 64, R = 12, T = 14, B = 34;
    const max = Math.max(1, ...months.map(m => Math.max(m.sale, m.profit)));
    const step = Math.pow(10, Math.floor(Math.log10(max))); let top = Math.ceil(max / step) * step; if (top / step < 3) top = Math.ceil(max / (step / 2)) * (step / 2);
    const minP = Math.min(0, ...months.map(m => m.profit)); const bottom = minP < 0 ? -Math.ceil(-minP / (top / 4)) * (top / 4) : 0;
    const y = v => T + (top - v) / (top - bottom) * (H - T - B);
    const ticks = []; for (let v = bottom; v <= top + 1e-9; v += top / 4) ticks.push(v);
    const gw = (W - L - R) / months.length, bw = Math.min(26, gw * 0.3);
    const short = v => { const a = Math.abs(v); return (v < 0 ? "−" : "") + (a >= 1000 ? (a / 1000).toFixed(a % 1000 ? 1 : 0) + "k" : Math.round(a)); };
    let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${short(v)}</text>`).join("");
    months.forEach((m, i) => {
      const cx = L + gw * i + gw / 2;
      const ys = y(m.sale), yp = y(Math.max(0, m.profit)), y0 = y(0);
      g += `<rect x="${cx - bw - 2}" y="${ys}" width="${bw}" height="${Math.max(0, y0 - ys)}" rx="3" fill="var(--accent)"><title>Sales ${esc(money(m.sale))}</title></rect>`;
      const ph = m.profit >= 0 ? y0 - yp : y(m.profit) - y0;
      g += `<rect x="${cx + 2}" y="${m.profit >= 0 ? yp : y0}" width="${bw}" height="${Math.max(0, ph)}" rx="3" fill="${m.profit >= 0 ? "var(--ok)" : "var(--bad)"}"><title>Profit ${esc(money(m.profit))}</title></rect>`;
      g += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(m.label)}</text>`;
    });

  function renderMoney() {

    for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`, label: d.toLocaleDateString(undefined, { month: "short" }), sale: 0, profit: 0 }); }

          ${owing.length ? `<ul class="owe">${owing.map(p => `<li data-open="${esc(p.id)}" tabindex="0"><span><b>${esc(p.client || p.name)}</b><br><span style="font-size:12.5px;color:var(--muted)">${esc(p.code)} · ${esc(p.name)}</span></span><span class="amt">${esc(money(calc(p).balance))}</span></li>`).join("")}</ul>` : `<p class="lede">Everyone has paid in full.</p>`}

        <tbody>${rows.map(p => { const c = calc(p); return `<tr class="click" data-open="${esc(p.id)}" tabindex="0"><td class="mono" style="color:var(--muted);font-size:12.5px">${esc(p.code)}</td><td><div class="t1">${esc(p.name)}</div><div class="t2">${esc(p.client || "—")}</div></td><td class="num">${c.q}</td><td class="num">${esc(money(Math.round(avgPrice(p) * 100) / 100))}</td><td class="num">${esc(money(c.sale))}</td><td class="num">${esc(money(c.cost))}</td><td class="num ${c.profit >= 0 ? "pos" : "neg"}">${esc(money(c.profit))}</td><td class="num">${c.sale ? Math.round(c.profit / c.sale * 100) + "%" : "—"}</td></tr>`; }).join("")}</tbody>

  function copyText(text) {
    const fallback = () => { const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (_) {} t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(fallback);
    fallback(); return Promise.resolve();
  }
  function sizesText(line) { return SIZES.filter(k => num(line.sizes && line.sizes[k])).map(k => `${k} ${num(line.sizes[k])}`).join(" · "); }
  function orderText(p, withPrices) {
    const pl = p.pl || state.priceList, c = calc(p), out = [];
    out.push(`KEMAS APPAREL · ${p.code}`);

    if (p.client) out.push(`Client: ${p.client}`);
    if (p.due) out.push(`Due: ${fmtDay(p.due)}`);
    if (hasLines(p)) {
      out.push(`Fabric: ${fabricLabel(pick(pl.fabrics, p.fabric))}`);
      p.lines.forEach((l, i) => {
        const lc = lineCalc(p, l);
        const opts = [pick(pl.collars, l.collar).name, pick(pl.sleeves, l.sleeve).name, ...(l.addons || []).map(id => ((pl.addons || []).find(x => x.id === id) || {}).name).filter(Boolean)];
        out.push("");
        out.push(`${i + 1}. ${l.label ? l.label + ": " : ""}${opts.join(", ")}`);
        out.push(`   ${lc.bySize ? sizesText(l) + " = " : ""}${lc.pcs} pcs`);
        if (withPrices) out.push(`   ${money(lc.unit)}/pc${lc.bigPcs ? ` · 3XL+ ${money(lc.bigUnit)}/pc` : ""} → ${money(lc.sale)}`);
      });
      out.push("");
    } else if (p.shirt) out.push(`Shirt: ${p.shirt}`);
    out.push(`Total: ${c.q} pcs`);
    if (withPrices) {
      if (num(p.adjust)) out.push(`${num(p.adjust) < 0 ? "Discount" : "Adjustment"}: ${money(num(p.adjust))}`);
      out.push(`Total price: ${money(c.sale)}`);
      if (c.paid) out.push(`Paid: ${money(c.paid)}`);
      if (c.paid) out.push(`Balance: ${c.balance > 0 ? money(c.balance) : "Fully paid"}`);
    }
    return out.join("\n");
  }

    form.addEventListener("submit", async e => {
      e.preventDefault(); readTop();
      if (!draft.name) { $("#name-err").hidden = false; $("#f-name").focus(); return; }
      const { id, ...data } = draft;
      delete data.sizes; delete data.qty; delete data.price;
      if (isNew) { data.createdAt = new Date().toISOString(); data.history = [{ stage: data.stage, at: data.createdAt }]; }
      else if (p.stage !== data.stage) data.history = [...(data.history || []), { stage: data.stage, at: new Date().toISOString() }];
      const btn = $("#m-save"); btn.disabled = true; btn.textContent = "Saving…";
      try { await saveProject(isNew ? null : p.id, data); close(); toast(isNew ? "Project added" : "Saved"); }
      catch (err) { btn.disabled = false; btn.textContent = isNew ? "Add project" : "Save changes"; showErr(err); }
    });
    setTimeout(() => (isNew ? $("#f-name") : $("#m-close")).focus(), 0);
  }

  /* ---------- price list editor ---------- */
  const PL_SECTIONS = [["fabrics", "Fabrics", true], ["collars", "Collars", false], ["sleeves", "Sleeves", false], ["addons", "Add-ons", false]];
  function openPriceList() {
    const draft = clone(state.priceList);
    const root = $("#modal-root"); const lastFocus = document.activeElement;
    root.innerHTML = `<div class="scrim" id="scrim"><form class="sheet" id="plform" role="dialog" aria-modal="true" aria-labelledby="pl-title" novalidate>
      <div class="sheet-head"><div><div class="code">SALES KIT</div><h2 id="pl-title">Price list</h2></div><button type="button" class="x" id="pl-close" aria-label="Close">×</button></div>
      <div class="sheet-body" id="pl-body"></div>
      <div class="sheet-foot"><button type="button" class="btn" id="pl-reset">Reset to sales kit</button><span class="spacer"></span><button type="button" class="btn" id="pl-cancel">Cancel</button><button type="submit" class="btn primary">Save price list</button></div>
    </form></div>`;
    const body = $("#pl-body");
    function draw() {
      body.innerHTML = `<p class="note" style="font-size:14px">Prices are per shirt, added on top of the base price. New projects use this list. Projects you already made keep their own prices.</p>
        <div class="grid2">
          <div class="field"><label for="pl-base">Default base price (${esc(state.currency)})</label><input id="pl-base" data-top="base" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(draft.base)}"><span class="help">Filled in for new projects. You can change it per project.</span></div>
          <div class="field"><label for="pl-big">Big size charge (${esc(state.currency)})</label><div style="display:flex;gap:6px"><select id="pl-bigfrom" data-top="bigFrom" class="inp" style="max-width:110px" aria-label="From size">${SIZES.map(k => `<option ${k === draft.bigFrom ? "selected" : ""}>${k}</option>`).join("")}</select><input id="pl-big" data-top="big" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(draft.big)}"></div><span class="help">This size and above, per shirt</span></div>
        </div>
        ${PL_SECTIONS.map(([key, title, note]) => `<fieldset class="pl-sec"><legend>${title}</legend>
          <div class="pl-row ${note ? "has-note" : ""}"><span class="pl-head">Name</span>${note ? `<span class="pl-head">Detail</span>` : ""}<span class="pl-head">+ ${esc(state.currency)}</span><span></span></div>
          ${draft[key].map((it, i) => `<div class="pl-row ${note ? "has-note" : ""}" data-sec="${key}" data-i="${i}">
            <input class="inp" data-f="name" value="${esc(it.name)}" aria-label="${title} name">
            ${note ? `<input class="inp" data-f="note" value="${esc(it.note || "")}" placeholder="e.g. 160 gsm" aria-label="Detail">` : ""}
            <input class="inp" data-f="price" type="number" step="0.01" inputmode="decimal" value="${esc(it.price)}" aria-label="Price">
            <button type="button" class="x2" data-rm aria-label="Remove ${esc(it.name)}">×</button></div>`).join("")}
          <div><button type="button" class="linkbtn" data-addsec="${key}">+ Add ${title.toLowerCase().replace(/s$/, "")}</button></div>
        </fieldset>`).join("")}`;
    }
    draw();
    body.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset.top) { draft[t.dataset.top] = t.dataset.top === "big" ? num(t.value) : t.value; return; }
      const row = t.closest("[data-sec]"); if (!row) return;
      const it = draft[row.dataset.sec][+row.dataset.i];
      it[t.dataset.f] = t.dataset.f === "price" ? num(t.value) : t.value;
    });
    body.addEventListener("change", e => { if (e.target.dataset.top === "bigFrom") draft.bigFrom = e.target.value; });
    body.addEventListener("click", e => {
      const rm = e.target.closest("[data-rm]");
      if (rm) { const row = rm.closest("[data-sec]"); if (draft[row.dataset.sec].length <= 1) { toast("Keep at least one in each list."); return; } draft[row.dataset.sec].splice(+row.dataset.i, 1); draw(); return; }
      const add = e.target.closest("[data-addsec]");
      if (add) { draft[add.dataset.addsec].push({ id: "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: "", note: "", price: 0 }); draw(); const rows = body.querySelectorAll(`[data-sec="${add.dataset.addsec}"]`); rows[rows.length - 1].querySelector("input").focus(); }
    });
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); if (lastFocus && lastFocus.focus) lastFocus.focus(); };
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("#pl-close").onclick = close; $("#pl-cancel").onclick = close;
    $("#scrim").addEventListener("mousedown", e => { if (e.target.id === "scrim") close(); });
    const reset = $("#pl-reset");
    reset.onclick = () => {
      if (!reset.classList.contains("armed")) { reset.classList.add("armed", "danger"); reset.textContent = "Tap again to reset"; return; }
      Object.assign(draft, clone(DEFAULT_PL), { base: draft.base }); reset.classList.remove("armed", "danger"); reset.textContent = "Reset to sales kit"; draw();
    };
    $("#plform").addEventListener("submit", e => {
      e.preventDefault();
      PL_SECTIONS.forEach(([k]) => { draft[k] = draft[k].filter(it => String(it.name).trim()); if (!draft[k].length) draft[k] = clone(DEFAULT_PL[k]); });
      state.priceList = draft; state.priceListAt = new Date().toISOString();
      try { persist(); } catch (_) { toast("Couldn't save the price list."); return; }
      close(); render(); toast("Price list saved");
    });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", async e => {
    const tab = e.target.closest("[data-tab]"); if (tab) { state.tab = tab.dataset.tab; try { localStorage.setItem("kemas-tab", state.tab); } catch (_) {} render(); return; }
    if (e.target.closest("#new-btn, [data-new]")) { openModal(null); return; }
    if (e.target.closest("#export-btn")) { exportBackup(); return; }
    if (e.target.closest("[data-pricelist]")) { openPriceList(); return; }
    const adv = e.target.closest("[data-advance]");
    if (adv) { e.stopPropagation(); const p = state.projects.find(x => x.id === adv.dataset.advance); const i = STAGES.findIndex(s => s.id === p.stage); if (p && i >= 0 && STAGES[i + 1]) { adv.disabled = true; try { await moveStage(p, STAGES[i + 1].id); } catch (_) { adv.disabled = false; toast("Couldn't move it. Try again."); } } return; }
    const f = e.target.closest("[data-filter]"); if (f) { state.stageFilter = f.dataset.filter; render(); return; }
    const o = e.target.closest("[data-open]"); if (o && !e.target.closest("#modal-root")) { const p = state.projects.find(x => x.id === o.dataset.open); if (p) openModal(p); }
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); const p = state.projects.find(x => x.id === e.target.dataset.open); if (p) openModal(p); }
  });
  document.addEventListener("input", e => { if (e.target.id === "search") { state.q = e.target.value; render(); } });
  document.addEventListener("change", async e => {
    if (e.target.id === "import-file") { const f = e.target.files && e.target.files[0]; if (f) await importBackup(f); e.target.value = ""; return; }
    if (e.target.id !== "currency") return;
    const v = e.target.value.trim().slice(0, 5) || "RM";
    state.currency = v; state.currencyAt = new Date().toISOString(); render();
    try { persist(); toast("Currency updated"); } catch (_) { toast("Couldn't save the currency."); }
  });


  /* ---------- sync through a private GitHub Gist ---------- */
  const SYNC_KEY = "kemas-sync-v1", FILE = "kemas-data.json", DESC = "KEMAS APPAREL data (used by the KEMAS app, do not delete)";
  const sync = { token: "", gistId: "", login: "", status: "off", last: "", msg: "", running: false, again: false, timer: 0 };
  try { Object.assign(sync, JSON.parse(localStorage.getItem(SYNC_KEY) || "{}")); } catch (_) {}
  sync.status = sync.token ? "idle" : "off";
  const saveSyncCfg = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ token: sync.token, gistId: sync.gistId, login: sync.login, last: sync.last })); } catch (_) {} };

  async function gh(path, opts = {}) {
    const headers = { Authorization: "Bearer " + sync.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    if (opts.body) headers["Content-Type"] = "application/json";
    const r = await fetch("https://api.github.com" + path, { ...opts, headers, cache: "no-store" });
    if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  }
  const stable = v => Array.isArray(v) ? "[" + v.map(stable).join(",") + "]" : v && typeof v === "object" ? "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}" : JSON.stringify(v ?? null);
  const snapshot = () => ({ app: "kemas-apparel", version: 1, projects: state.projects, deleted: state.deleted, currency: state.currency, currencyAt: state.currencyAt, priceList: state.priceListAt ? state.priceList : null, priceListAt: state.priceListAt });
  const sig = d => stable({ p: [...(d.projects || [])].sort((a, b) => String(a.id).localeCompare(String(b.id))), d: d.deleted || {}, c: d.currency || "", ca: d.currencyAt || "", pl: d.priceListAt ? d.priceList : null, pla: d.priceListAt || "" });

  function merge(a, b) {
    const deleted = { ...(a.deleted || {}) };
    Object.entries(b.deleted || {}).forEach(([id, t]) => { if (!deleted[id] || t > deleted[id]) deleted[id] = t; });
    const byId = new Map();
    [...(a.projects || []), ...(b.projects || [])].forEach(p => {
      if (!p || !p.id) return;
      const cur = byId.get(p.id);
      if (!cur || String(p.updatedAt || "") > String(cur.updatedAt || "")) byId.set(p.id, p);
    });
    const projects = [...byId.values()].filter(p => !(deleted[p.id] && deleted[p.id] >= String(p.updatedAt || "")));
    const useB = String(b.currencyAt || "") > String(a.currencyAt || "");
    const plB = String(b.priceListAt || "") > String(a.priceListAt || "");
    return { app: "kemas-apparel", version: 1, projects, deleted, currency: (useB ? b.currency : a.currency) || a.currency || b.currency || "RM", currencyAt: useB ? b.currencyAt : a.currencyAt,
      priceList: plB ? b.priceList : a.priceList, priceListAt: plB ? b.priceListAt : a.priceListAt };
  }

  async function findOrCreateGist() {
    for (let page = 1; page <= 5; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      const hit = list.find(g => g.files && g.files[FILE]);
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: DESC, public: false, files: { [FILE]: { content: JSON.stringify(snapshot()) } } }) });
    return g.id;
  }
  async function readRemote() {
    const g = await gh(`/gists/${sync.gistId}`);
    const f = g.files && g.files[FILE];
    if (!f) return null;
    const text = f.truncated ? await (await fetch(f.raw_url, { cache: "no-store" })).text() : f.content;
    try { return JSON.parse(text); } catch (_) { return null; }
  }

  async function syncNow() {
    if (!sync.token) return;
    if (sync.running) { sync.again = true; return; }
    sync.running = true; sync.again = false; setSync("syncing");
    try {
      if (!sync.gistId) { sync.gistId = await findOrCreateGist(); saveSyncCfg(); }
      let remote;
      try { remote = await readRemote(); }
      catch (e) { if (e.status === 404) { sync.gistId = await findOrCreateGist(); saveSyncCfg(); remote = await readRemote(); } else throw e; }
      remote = remote || { projects: [], deleted: {} };
      const local = snapshot();
      const merged = merge(local, remote);
      if (sig(merged) !== sig(local)) {
        state.projects = merged.projects; state.deleted = merged.deleted; state.currency = merged.currency; state.currencyAt = merged.currencyAt;
        if (merged.priceListAt && merged.priceList) { state.priceList = merged.priceList; state.priceListAt = merged.priceListAt; }
        persistLocal(); render();
      }
      if (sig(merged) !== sig(remote)) {
        await gh(`/gists/${sync.gistId}`, { method: "PATCH", body: JSON.stringify({ files: { [FILE]: { content: JSON.stringify(merged) } } }) });
      }
      sync.last = new Date().toISOString(); saveSyncCfg(); setSync("ok");
    } catch (e) {
      if (e.status === 401) setSync("error", "GitHub didn't accept the key. It may have expired. Open Sync and connect again with a new key.");
      else if (e.status === 403 || e.status === 404) setSync("error", "The key can't use Gists. Make a new key with the “gist” box ticked.");
      else if (e.status === 429) setSync("error", "GitHub asked to slow down. It will try again shortly.");
      else setSync("offline", "No internet connection. Your changes are kept on this device and will sync when you're back online.");
    } finally {
      sync.running = false;
      if (sync.again) syncNow();
    }
  }
  function scheduleSync() { if (!sync.token) return; clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 1200); if (sync.status !== "syncing") setSync("syncing"); }

  const ago = iso => { if (!iso) return "never"; const s = Math.round((Date.now() - new Date(iso)) / 1000); if (s < 45) return "just now"; const m = Math.round(s / 60); if (m < 60) return m + " min ago"; const h = Math.round(m / 60); if (h < 24) return h + " h ago"; return fmtStamp(iso); };
  function setSync(status, msg) {
    sync.status = status; sync.msg = msg || "";
    const btn = $("#sync-btn"), t = $("#sync-text");
    btn.dataset.s = status;
    t.textContent = { off: "Connect sync", idle: "Sync", syncing: "Syncing…", ok: "Synced", offline: "Offline", error: "Sync problem" }[status] || "Sync";
    btn.title = status === "ok" ? "Last synced " + ago(sync.last) : sync.msg || "";
    if (status === "error") banner(sync.msg, "warn"); else if (status === "ok") banner(null);
    const live = document.getElementById("sync-live"); if (live) fillSyncModal();
  }

  function openSyncModal() {
    const root = $("#modal-root"); const lastFocus = document.activeElement;
    root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
      <div class="sheet-head"><div><div class="code">PHONE ⇄ LAPTOP</div><h2 id="s-title">Sync your projects</h2></div><button type="button" class="x" id="s-close" aria-label="Close">×</button></div>
      <div class="sheet-body" id="sync-live"></div></div></div>`;
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); if (lastFocus && lastFocus.focus) lastFocus.focus(); };
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    $("#s-close").onclick = close;
    $("#scrim").addEventListener("mousedown", e => { if (e.target.id === "scrim") close(); });
    fillSyncModal();
    setTimeout(() => ($("#s-token") || $("#s-close")).focus(), 0);
  }
  function fillSyncModal() {
    const box = document.getElementById("sync-live"); if (!box) return;
    if (!sync.token) {
      box.innerHTML = `<p class="note" style="font-size:14px;color:var(--ink)">Your projects are saved in a private file on your GitHub account. Every device you connect reads and saves that same file, so your phone and laptop always match.</p>
        <ol class="steps">
          <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=KEMAS%20APPAREL%20sync" target="_blank" rel="noopener">Make a GitHub key</a> (opens GitHub). Set <b>Expiration</b> to <b>No expiration</b>, leave only <b>gist</b> ticked, then tap <b>Generate token</b> and copy it.</li>
          <li>Paste it here and tap Connect.</li>
        </ol>
        <div class="field"><label for="s-token">GitHub key</label><input id="s-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"><span class="err" id="s-err" hidden></span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="s-connect">Connect</button></div>
        <p class="note">Do the same on your other device. You can paste the same key, or make a new one there. Any key from your GitHub account finds the same file.</p>`;
      $("#s-connect").onclick = async () => {
        const v = $("#s-token").value.trim(), err = $("#s-err"), b = $("#s-connect");
        if (!v) { err.textContent = "Paste your GitHub key first."; err.hidden = false; return; }
        b.disabled = true; b.textContent = "Connecting…"; err.hidden = true;
        sync.token = v;
        try {
          const me = await gh("/user"); sync.login = me.login || ""; sync.gistId = ""; saveSyncCfg();
          await syncNow();
          if (sync.status === "error") { throw Object.assign(new Error(), { status: 403 }); }
          toast("Sync is on"); fillSyncModal();
        } catch (e) {
          sync.token = ""; sync.login = ""; saveSyncCfg(); setSync("off");
          const err = $("#s-err"), b = $("#s-connect"); $("#s-token").value = v;
          err.textContent = e.status === 401 ? "That key didn't work. Check you copied all of it." : e.status === 403 ? "That key can't use Gists. Make a new one with “gist” ticked." : "Couldn't reach GitHub. Check your internet and try again.";
          err.hidden = false; b.disabled = false; b.textContent = "Connect";
        }
      };
      return;
    }
    const label = { idle: "Waiting", syncing: "Syncing…", ok: "Up to date", offline: "Offline, will sync later", error: "Needs attention" }[sync.status] || "";
    box.innerHTML = `<dl class="kv">
        <dt>Status</dt><dd>${esc(label)}</dd>
        <dt>Last synced</dt><dd>${esc(ago(sync.last))}</dd>
        <dt>GitHub account</dt><dd>${esc(sync.login || "—")}</dd>
        <dt>Data file</dt><dd>${sync.gistId ? `<a href="https://gist.github.com/${encodeURIComponent(sync.gistId)}" target="_blank" rel="noopener" style="color:var(--accent)">Open on GitHub</a>` : "—"}</dd>
      </dl>
      ${sync.msg ? `<p class="note" style="color:var(--warn)">${esc(sync.msg)}</p>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="s-now">Sync now</button><button class="btn danger" type="button" id="s-off">Turn off sync on this device</button></div>
      <p class="note">Changes sync a second after you save, when you open the app, and every minute while it's open.</p>`;
    $("#s-now").onclick = () => syncNow();
    const off = $("#s-off");
    off.onclick = () => {
      if (!off.classList.contains("armed")) { off.classList.add("armed"); off.textContent = "Tap again to turn off"; return; }
      sync.token = ""; sync.gistId = ""; sync.login = ""; sync.last = ""; saveSyncCfg(); setSync("off"); banner(null); fillSyncModal(); toast("Sync turned off. Projects stay on this device.");
    };
  }
  document.addEventListener("click", e => { if (e.target.closest("#sync-btn")) openSyncModal(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
  window.addEventListener("online", () => syncNow());
  setInterval(() => { if (document.visibilityState === "visible" && !sync.running) syncNow(); }, 60000);

  /* ---------- boot ---------- */
  try { const t = localStorage.getItem("kemas-tab"); if (["board", "jobs", "money"].includes(t)) state.tab = t; } catch (_) {}
  render();

  function boot() {
    state.priceList = clone(DEFAULT_PL);
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); state.projects = Array.isArray(d.projects) ? d.projects : []; state.deleted = d.deleted || {}; state.currencyAt = d.currencyAt || ""; if (d.priceList) { state.priceList = d.priceList; state.priceListAt = d.priceListAt || ""; } if (d.currency) state.currency = String(d.currency); }
    } catch (_) { banner("This browser is blocking storage, so projects can't be saved. Turn off Private Browsing and reopen the app.", "warn"); }
    state.loaded = true; state.mode = "local";
    render();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    setSync(sync.token ? "idle" : "off");
    syncNow();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  boot();
})();
</script>
</body>
</html>
