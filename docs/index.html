<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revise — Spaced Repetition</title>
<meta name="description" content="Spaced repetition planner using the 1-3-7-14-30 schedule.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --text:#1c1f2a; --muted:#6b7280; --line:#e5e7ef;
  --accent:#4f46e5; --accent-soft:#eef0ff; --ok:#16a34a; --ok-soft:#e7f7ec;
  --warn:#d97706; --warn-soft:#fdf3e2; --bad:#dc2626; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(20,20,40,.06),0 4px 16px rgba(20,20,40,.05);
}
:root[data-theme="dark"]{
  --bg:#0f1117; --card:#181b24; --text:#e8eaf0; --muted:#9aa1b2; --line:#2a2f3c;
  --accent:#8b86ff; --accent-soft:#25264a; --ok:#4ade80; --ok-soft:#173023;
  --warn:#fbbf24; --warn-soft:#3a2e12; --bad:#f87171; --bad-soft:#3b1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --card:#181b24; --text:#e8eaf0; --muted:#9aa1b2; --line:#2a2f3c;
    --accent:#8b86ff; --accent-soft:#25264a; --ok:#4ade80; --ok-soft:#173023;
    --warn:#fbbf24; --warn-soft:#3a2e12; --bad:#f87171; --bad-soft:#3b1a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:26px}
.spacer{flex:1}
main{max-width:960px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:20px 0 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.icon-btn{border:none;background:transparent;cursor:pointer;padding:6px;border-radius:8px;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--accent-soft)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:160px;border:none;background:none;padding:9px 4px 8px;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
nav.tabs button span.i{font-size:20px;line-height:1}
nav.tabs button.active{color:var(--accent);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;
  border:none;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(79,70,229,.4);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:12px}
.stat .n{font-size:24px;font-weight:700}
.stat .l{color:var(--muted);font-size:12px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.item .title{font-weight:600;word-break:break-word}
.item .desc{color:var(--muted);font-size:13px;margin-top:2px;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--text)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
.badge.over{background:var(--bad-soft);color:var(--bad)}
.badge.today{background:var(--warn-soft);color:var(--warn)}
.badge.up{background:var(--accent-soft);color:var(--accent)}
.badge.done{background:var(--ok-soft);color:var(--ok)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stages{display:flex;gap:4px;margin-top:8px}
.stage{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stage.done{background:var(--ok)}
.stage.over{background:var(--bad)}
.stage.today{background:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{flex:1;min-width:140px}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head .m{font-weight:700;font-size:16px;flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal .d{min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:5px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;text-align:left}
.cal .d.out{opacity:.4}
.cal .d.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .d.sel{background:var(--accent-soft)}
.cal .d .num{font-size:12px;font-weight:600}
.cal .d .dots{display:flex;flex-wrap:wrap;gap:3px}
.cal .d .dots i{width:7px;height:7px;border-radius:50%;display:block}
.cal .d .cnt{font-size:11px;color:var(--muted)}
@media (max-width:600px){.cal .d{min-height:48px;padding:4px}}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{border-radius:18px}}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.preview .chip{background:var(--bg);border:1px solid var(--line)}
.timeline{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tl{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.tl .when{flex:1}
.tl .when small{color:var(--muted);display:block}
.row{display:flex;gap:10px}
.row>*{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.settings .card{margin-bottom:12px}
.settings p{margin:6px 0;color:var(--muted);font-size:13px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch span{font-size:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button{padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.rate button b{display:block;font-size:20px}
.rate button:hover{border-color:var(--accent)}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .t{flex:1;min-width:180px;font-size:14px}
.hidden{display:none!important}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars-l{display:flex;gap:4px;font-size:10px;color:var(--muted)}
.bars-l span{flex:1;text-align:center}
/* focus / pomodoro */
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.focus-grid{grid-template-columns:1fr}}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 14px}
.ring{position:relative;width:240px;height:240px;max-width:70vw;max-height:70vw}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring.brk .prog{stroke:var(--ok)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.ring .phase{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.rounds{display:flex;gap:6px}
.rounds i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.rounds i.on{background:var(--accent)}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrls .btn{min-width:92px}
.ctrls .btn.big{padding:12px 28px;font-size:16px;font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.presets button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.num{display:flex;align-items:center;gap:6px}
.num input{width:70px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px}
.num span{color:var(--muted);font-size:13px}
input:disabled,select:disabled,.presets button:disabled{opacity:.5;cursor:not-allowed}
.goal{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.goal div{height:100%;background:var(--ok);border-radius:5px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 6px;font-weight:600}
.day-h small{color:var(--muted);font-weight:500}
.rec{display:flex;gap:10px;align-items:center;padding:10px 12px}
.rec+.rec{border-top:1px solid var(--line)}
.rec .body{flex:1;min-width:0}
.rec .tm{font-size:13px;color:var(--muted)}
.rec .dur{font-weight:700;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.rec input[type=checkbox]{width:18px;height:18px}
.recs{padding:0}
.selbar{position:sticky;top:58px;z-index:4;display:flex;gap:8px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin-bottom:8px;flex-wrap:wrap}
.selbar .t{flex:1}
.toast .undo{background:none;border:none;color:var(--accent);font-weight:700;margin-left:10px;cursor:pointer}
:root[data-theme="dark"] .toast .undo{color:#4f46e5}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><img src="icon.svg" alt="">Revise</div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">🌓</button>
</div></header>

<main id="view"></main>

<button class="fab" id="fab" title="Add topic" aria-label="Add topic">+</button>

<nav class="tabs">
  <button data-tab="today" class="active"><span class="i">🏠</span>Today</button>
  <button data-tab="focus"><span class="i">⏱️</span>Focus</button>
  <button data-tab="calendar"><span class="i">📅</span>Calendar</button>
  <button data-tab="topics"><span class="i">📚</span>Topics</button>
  <button data-tab="stats"><span class="i">📈</span>Stats</button>
  <button data-tab="settings"><span class="i">⚙️</span>Settings</button>
</nav>

<div id="modalRoot"></div>

<script>
/* ============ Storage ============ */
const KEY = 'revise.v1';
const DEFAULT = {
  topics: [],
  settings: { intervals:[1,3,7,14,30], reminderTime:'08:00', notify:false, shiftLate:false, theme:'auto' },
  log: [], // {date, topicId, stage, rating}
  // Pomodoro settings and study-session records
  focus: { study:25, brk:5, longBrk:15, longEvery:4, autoStart:false, sound:true, goal:120 },
  sessions: [] // {id, start, end, minutes, subject, topicId, topicTitle, note, completed, manual}
};
let db = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ return normalize(JSON.parse(raw)); }
  }catch(e){}
  return structuredClone(DEFAULT);
}
function normalize(d){
  return {...structuredClone(DEFAULT), ...d,
    settings:{...DEFAULT.settings, ...(d.settings||{})},
    focus:{...DEFAULT.focus, ...(d.focus||{})},
    sessions: Array.isArray(d.sessions) ? d.sessions : []};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Could not save — storage is unavailable'); } }

/* ============ Dates ============ */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 86400000); // a - b in days
const fmt = s => parse(s).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'});
const fmtLong = s => parse(s).toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
function rel(s){
  const n = diff(s, today());
  if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday';
  return n>0 ? `in ${n} days` : `${-n} days overdue`;
}

/* ============ Model ============ */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function buildReviews(learned, intervals){
  return intervals.map(i => ({ interval:i, due:addDays(learned, i), done:null, rating:null }));
}
function nextReview(t){ return t.reviews.find(r => !r.done); }
function status(r){
  if(r.done) return 'done';
  const n = diff(r.due, today());
  return n<0 ? 'over' : n===0 ? 'today' : 'up';
}
function subjectColor(name){
  let h = 0; for(const c of (name||'').toLowerCase()) h = (h*31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 70% 55%)`;
}
function subjects(){ return [...new Set(db.topics.map(t => t.subject).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); }
function getTopic(id){ return db.topics.find(t => t.id === id); }

function completeReview(topicId, idx, rating){
  const t = getTopic(topicId); const r = t.reviews[idx];
  const td = today();
  r.done = td; r.rating = rating;
  // Shift the remaining reviews if done late and the setting is on
  const late = diff(td, r.due);
  if(db.settings.shiftLate && late > 0){
    t.reviews.slice(idx+1).forEach(x => { if(!x.done) x.due = addDays(x.due, late); });
  }
  // "Hard" → add an extra review tomorrow (if one isn't already there)
  if(rating === 'hard'){
    const tom = addDays(td, 1);
    const nxt = t.reviews.slice(idx+1).find(x => !x.done);
    if(!nxt || nxt.due !== tom){
      t.reviews.splice(idx+1, 0, { interval:'extra', due:tom, done:null, rating:null, extra:true, xid:uid() });
    }
  }
  db.log.push({ date:td, topicId, stage:r.interval, rating });
  save();
}
function undoReview(topicId, idx){
  const t = getTopic(topicId); const r = t.reviews[idx];
  // remove the extra review this one added, if untouched
  const n = t.reviews[idx+1];
  if(r.rating==='hard' && n && n.extra && !n.done) t.reviews.splice(idx+1,1);
  const li = db.log.map(l=>l.topicId+'|'+l.date+'|'+l.stage).lastIndexOf(topicId+'|'+r.done+'|'+r.interval);
  if(li>=0) db.log.splice(li,1);
  r.done = null; r.rating = null;
  save();
}

/* Every pending review, with its topic */
function allPending(){
  const out = [];
  db.topics.forEach(t => t.reviews.forEach((r,i) => { if(!r.done) out.push({t, r, i}); }));
  return out.sort((a,b) => a.r.due.localeCompare(b.r.due));
}
function dueNow(){ const td = today(); return allPending().filter(x => x.r.due <= td && !x.t.archived); }

/* ============ UI helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  if(undo){
    const b = document.createElement('button'); b.className='undo'; b.textContent='Undo';
    b.onclick = () => { undo(); el.remove(); }; el.appendChild(b);
  }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), undo ? 6000 : 2600);
}
function stageLabel(r){ return r.extra ? 'Extra review' : `Day ${r.interval}`; }
function chip(subject){
  if(!subject) return '';
  return `<span class="chip"><span class="dot" style="background:${subjectColor(subject)}"></span>${esc(subject)}</span>`;
}
function stagesBar(t){
  return `<div class="stages">${t.reviews.map(r => `<div class="stage ${status(r)}" title="${stageLabel(r)} · ${fmt(r.due)}"></div>`).join('')}</div>`;
}

let tab = 'today';
let calMonth = (()=>{ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calSel = today();
let topicFilter = { q:'', subject:'', state:'active' };

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  const v = $('#view');
  if(tab==='today') v.innerHTML = renderToday();
  if(tab==='focus'){ v.innerHTML = renderFocus(); updateTimerUI(); }
  $('#fab').classList.toggle('hidden', tab==='focus');
  if(tab==='calendar') v.innerHTML = renderCalendar();
  if(tab==='topics') v.innerHTML = renderTopics();
  if(tab==='stats') v.innerHTML = renderStats();
  if(tab==='settings') v.innerHTML = renderSettings();
  updateBadge();
}

/* ============ Today ============ */
function reviewRow({t, r, i}){
  const s = status(r);
  const badge = s==='over' ? `<span class="badge over">${rel(r.due)}</span>` :
                s==='today' ? `<span class="badge today">Due today</span>` :
                `<span class="badge up">${fmt(r.due)}</span>`;
  const canDo = s!=='up';
  return `<div class="card item">
    <div class="body" data-open="${t.id}" style="cursor:pointer">
      <div class="title">${esc(t.title)}</div>
      ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ''}
      <div class="meta">${chip(t.subject)}<span class="chip">${stageLabel(r)}</span>${badge}</div>
    </div>
    <div class="actions">${canDo ? `<button class="btn primary small" data-review="${t.id}|${i}">Review</button>` :
      `<button class="btn small" data-review="${t.id}|${i}">Review early</button>`}</div>
  </div>`;
}
function renderToday(){
  const td = today();
  const pend = allPending().filter(x => !x.t.archived);
  const over = pend.filter(x => x.r.due < td);
  const due = pend.filter(x => x.r.due === td);
  const week = pend.filter(x => x.r.due > td && x.r.due <= addDays(td, 7));
  const doneToday = db.log.filter(l => l.date === td).length;
  let banner = '';
  if('Notification' in window && Notification.permission === 'default' && !db.settings.dismissedNotif){
    banner = `<div class="banner"><div class="t">🔔 Turn on reminders so you get notified when reviews are due.</div>
      <button class="btn primary small" data-act="enableNotif">Enable</button>
      <button class="btn ghost small" data-act="dismissNotif">Later</button></div>`;
  }
  if(!db.topics.length){
    return banner + `<div class="card empty">
      <div style="font-size:42px">🧠</div>
      <h2 style="margin:8px 0">Welcome to Revise</h2>
      <p>Add something you learned today. You'll be reminded to review it after<br><b>${db.settings.intervals.join(' · ')}</b> days.</p>
      <button class="btn primary" data-act="add">Add your first topic</button>
    </div>`;
  }
  return banner + `
  <div class="stats">
    <div class="card stat"><div class="n" style="color:var(--bad)">${over.length}</div><div class="l">Overdue</div></div>
    <div class="card stat"><div class="n" style="color:var(--warn)">${due.length}</div><div class="l">Due today</div></div>
    <div class="card stat"><div class="n" style="color:var(--ok)">${doneToday}</div><div class="l">Reviewed today</div></div>
    <div class="card stat"><div class="n">🔥 ${streak()}</div><div class="l">Day streak</div></div>
  </div>
  ${over.length ? `<h2>Overdue</h2><div class="list">${over.map(reviewRow).join('')}</div>` : ''}
  <h2>Today · ${fmt(td)}</h2>
  ${due.length ? `<div class="list">${due.map(reviewRow).join('')}</div>` :
    `<div class="card empty">${over.length ? 'Nothing new today — clear the overdue ones above.' : '🎉 All caught up for today!'}</div>`}
  <h2>Coming up this week</h2>
  ${week.length ? `<div class="list">${week.map(reviewRow).join('')}</div>` : `<div class="card empty">No reviews in the next 7 days.</div>`}`;
}
function streak(){
  const days = new Set(db.log.map(l => l.date));
  let d = today(), n = 0;
  if(!days.has(d)) d = addDays(d, -1); // today not done yet doesn't break the streak
  while(days.has(d)){ n++; d = addDays(d, -1); }
  return n;
}

/* ============ Calendar ============ */
function renderCalendar(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7)); // Monday start
  const byDay = {};
  db.topics.filter(t=>!t.archived).forEach(t => t.reviews.forEach((r,i) => { (byDay[r.due] ||= []).push({t,r,i}); }));
  const td = today();
  let cells = '';
  for(let k=0;k<42;k++){
    const d = new Date(start); d.setDate(start.getDate()+k);
    const s = ymd(d); const items = byDay[s] || [];
    const dots = items.slice(0,6).map(x => `<i style="background:${x.r.done ? 'var(--ok)' : subjectColor(x.t.subject)}"></i>`).join('');
    cells += `<button class="d ${d.getMonth()!==m?'out':''} ${s===td?'today':''} ${s===calSel?'sel':''}" data-day="${s}">
      <span class="num">${d.getDate()}</span><span class="dots">${dots}</span>${items.length>6?`<span class="cnt">+${items.length-6}</span>`:''}</button>`;
  }
  const sel = (byDay[calSel]||[]);
  return `<div class="card">
    <div class="cal-head">
      <button class="icon-btn" data-cal="-1">‹</button>
      <div class="m">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div>
      <button class="icon-btn" data-cal="1">›</button>
      <button class="btn small" data-cal="0">Today</button>
    </div>
    <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
  </div>
  <h2>${fmtLong(calSel)}</h2>
  ${sel.length ? `<div class="list">${sel.map(x => x.r.done ? doneRow(x) : reviewRow(x)).join('')}</div>` : `<div class="card empty">No reviews on this day.</div>`}`;
}
function doneRow({t,r,i}){
  return `<div class="card item"><div class="body" data-open="${t.id}" style="cursor:pointer">
    <div class="title">${esc(t.title)}</div>
    <div class="meta">${chip(t.subject)}<span class="chip">${stageLabel(r)}</span><span class="badge done">✓ Reviewed ${fmt(r.done)}${r.rating?` · ${rateEmoji(r.rating)}`:''}</span></div>

}
const rateEmoji = r => ({easy:'😄 Easy', ok:'🙂 Okay', hard:'😣 Hard'})[r] || '';

/* ============ Topics ============ */
function renderTopics(){
  const subs = subjects();

/* ============ Calendar export (.ics) ============ */
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
function fold(line){ // RFC 5545: 75-octet lines
  const out=[]; while(line.length>73){ out.push(line.slice(0,73)); line=' '+line.slice(73); } out.push(line); return out.join('\r\n');
}
function buildIcs(topics){
  const [hh,mm] = db.settings.reminderTime.split(':');
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Revise//Spaced Repetition//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Revise reviews'];
  let n = 0;
  topics.forEach(t => t.reviews.forEach((r,i) => {
    if(r.done) return;
    n++;
    const d = r.due.replace(/-/g,'');
    L.push('BEGIN:VEVENT',
      `UID:${t.id}-${r.extra?'x'+(r.xid||i):r.interval}@revise`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${d}T${hh}${mm}00`,
      'DURATION:PT20M',
      fold(`SUMMARY:${icsEscape(`📖 Review: ${t.title}${t.subject?' ('+t.subject+')':''} — ${stageLabel(r)}`)}`),
      fold(`DESCRIPTION:${icsEscape((t.description||'') + `\n\nLearned ${t.learned}. ${stageLabel(r)} of the ${db.settings.intervals.join('-')} schedule.`)}`),
      'BEGIN:VALARM','ACTION:DISPLAY',fold(`DESCRIPTION:${icsEscape('Review: '+t.title)}`),'TRIGGER:PT0M','END:VALARM',
      'END:VEVENT');
  }));
  L.push('END:VCALENDAR');
  return {text: L.join('\r\n'), n};
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportIcs(topics, name){
  const {text, n} = buildIcs(topics);
  if(!n){ toast('No upcoming reviews to export'); return; }
  download(name, text, 'text/calendar');
  toast(`Exported ${n} review${n>1?'s':''} — open the file to add them to your calendar`);
}

/* ============ Notifications ============ */
let swReg = null;
async function notify(title, body, tag='revise-due'){
  if(!('Notification' in window) || Notification.permission!=='granted') return false;
  const opts = { body, icon:'icon-192.png', badge:'icon-192.png', tag };
  try{
    if(swReg){ await swReg.showNotification(title, opts); return true; }
  }catch(e){}
  try{ new Notification(title, opts); return true; }catch(e){ return false; }
}
async function enableNotif(){
  if(!('Notification' in window)){ toast('Notifications are not supported here. Use the calendar export instead.'); return; }
  const p = await Notification.requestPermission();
  if(p==='granted'){ db.settings.notify = true; save(); toast('Reminders enabled'); checkReminder(true); registerPeriodic(); }
  else toast('Notifications were not allowed');
  render();
}
function dueSummary(){
  const d = dueNow();
  if(!d.length) return null;
  const names = d.slice(0,3).map(x=>x.t.title).join(', ');
  return { title:`📖 ${d.length} review${d.length>1?'s':''} due`, body: names + (d.length>3?` and ${d.length-3} more`:'') };
}
// Fires once per day, after the reminder time, while the app is open/opened.
function checkReminder(force){
  if(!db.settings.notify) return;
  const now = new Date(); const td = today();
  const [hh,mm] = db.settings.reminderTime.split(':').map(Number);
  const after = now.getHours()*60+now.getMinutes() >= hh*60+mm;
  if(!force && (!after || db.settings.lastNotified === td)) return;
  const s = dueSummary();
  if(s){ notify(s.title, s.body); db.settings.lastNotified = td; save(); }
}
async function registerPeriodic(){
  try{
    if(swReg && 'periodicSync' in swReg){
      const st = await navigator.permissions.query({name:'periodic-background-sync'});
      if(st.state==='granted') await swReg.periodicSync.register('revise-daily', {minInterval: 12*60*60*1000});
    }
  }catch(e){}
}
// Share due data with the service worker so background checks can notify.
async function syncToSW(){
  try{
    const cache = await caches.open('revise-data');
    const pend = allPending().filter(x=>!x.t.archived).map(x => ({due:x.r.due, title:x.t.title}));
    await cache.put('/__revise_due.json', new Response(JSON.stringify({pend, notify:db.settings.notify, time:db.settings.reminderTime, last:db.settings.lastNotified})));
  }catch(e){}
}
function updateBadge(){
  const n = dueNow().length;
  try{ if('setAppBadge' in navigator){ n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } }catch(e){}
  document.title = n ? `(${n}) Revise` : 'Revise — Spaced Repetition';
  syncToSW();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-act],[data-open],[data-review],[data-m],[data-rate],[data-cal],[data-day]');
  if(!el) return;
  const d = el.dataset;
  if(d.tab){ tab = d.tab; render(); scrollTo(0,0); return; }
  if(d.review){ e.stopPropagation(); const [id,i] = d.review.split('|'); reviewModal(id, +i); return; }
  if(d.rate){
    completeReview(d.id, +d.i, d.rate); closeModal(); render();
    const t = getTopic(d.id); const n = nextReview(t);
    toast(n ? `Nice! Next review ${rel(n.due).toLowerCase()} (${fmt(n.due)})` : '🏆 All reviews complete for this topic!');
    return;
  }
  if(d.open){ showTopic(d.open); return; }
  if(d.cal!=null){
    if(d.cal==='0'){ const n=new Date(); calMonth=new Date(n.getFullYear(), n.getMonth(),1); calSel=today(); }
    else calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+(+d.cal), 1);
    render(); return;
  }
  if(d.day){ calSel = d.day; const p=parse(d.day); if(p.getMonth()!==calMonth.getMonth()) calMonth=new Date(p.getFullYear(),p.getMonth(),1); render(); return; }
  if(d.m){
    const t = d.id && getTopic(d.id);
    if(d.m==='cancel') closeModal();
    if(d.m==='studyThis'){
      if(timer.running){ toast('A timer is already running'); }
      else { timer.subject = t.subject||''; timer.topicId = t.id; saveTimer(); }
      closeModal(); tab='focus'; render(); scrollTo(0,0);
    }
    if(d.m==='saveTopic') saveTopic(d.id);
    if(d.m==='edit') editTopic(d.id);
    if(d.m==='undo'){ undoReview(d.id, +d.i); showTopic(d.id); render(); }
    if(d.m==='archive'){ t.archived = !t.archived; save(); closeModal(); render(); toast(t.archived?'Archived':'Restored'); }
    if(d.m==='ics') exportIcs([t], `revise-${t.title.replace(/[^\w]+/g,'-').toLowerCase()}.ics`);
    if(d.m==='delete' && confirm(`Delete "${t.title}"? This cannot be undone.`)){
      db.topics = db.topics.filter(x=>x.id!==t.id); db.log = db.log.filter(l=>l.topicId!==t.id); save(); closeModal(); render(); toast('Deleted');
    }
    return;
  }
  if(d.act){
    const a = d.act;
    if(a==='add') editTopic();
    if(a==='enableNotif') enableNotif();
    if(a==='dismissNotif'){ db.settings.dismissedNotif = true; save(); render(); }
    if(a==='testNotif'){ if(Notification?.permission==='granted') notify('🔔 Revise test', dueSummary()?.body || 'Notifications are working!'); else enableNotif(); }
    if(a==='icsAll') exportIcs(db.topics.filter(t=>!t.archived), 'revise-reviews.ics');
    if(a==='resetInt'){ db.settings.intervals=[1,3,7,14,30]; save(); render(); toast('Schedule reset'); }
    if(a==='export') download(`revise-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json');
    if(a==='import') $('#importFile').click();
    if(a==='install' && deferredInstall){ deferredInstall.prompt(); deferredInstall = null; }
    if(a==='wipe' && confirm('Delete ALL topics and history on this device?')){ db = structuredClone(DEFAULT); save(); render(); toast('All data deleted'); }
  }
});
document.addEventListener('input', e => {

});
document.addEventListener('change', async e => {
  const id = e.target.id, s = db.settings;
  if(id==='fs'){ topicFilter.subject = e.target.value; render(); }
  if(id==='fstate'){ topicFilter.state = e.target.value; render(); }
  if(id==='sNotify'){ if(e.target.checked){ await enableNotif(); } else { s.notify=false; save(); render(); } }
  if(id==='sTime'){ s.reminderTime = e.target.value || '08:00'; s.lastNotified=null; save(); toast('Reminder time saved'); }
  if(id==='sShift'){ s.shiftLate = e.target.checked; save(); }
  if(id==='sTheme'){ s.theme = e.target.value; save(); applyTheme(); }
  if(id==='sInt'){
    const v = e.target.value.split(/[^\d]+/).map(Number).filter(n=>n>0);
    if(v.length){ s.intervals = [...new Set(v)].sort((a,b)=>a-b); save(); render(); toast('Schedule saved: '+s.intervals.join(', ')); }
    else toast('Enter numbers like 1, 3, 7, 14, 30');
  }
  if(id==='importFile' && e.target.files[0]){
    try{
      const d = JSON.parse(await e.target.files[0].text());
      if(!Array.isArray(d.topics)) throw 0;
      const merge = db.topics.length && confirm('Merge with the topics on this device?\nOK = merge, Cancel = replace everything');
      if(merge){
        const have = new Set(db.topics.map(t=>t.id));
        d.topics.forEach(t => { if(have.has(t.id)){ const i=db.topics.findIndex(x=>x.id===t.id); db.topics[i]=t; } else db.topics.push(t); });
        db.log = [...db.log, ...(d.log||[])];
        const haveS = new Set(db.sessions.map(s=>s.id));
        (d.sessions||[]).forEach(s => { if(!haveS.has(s.id)) db.sessions.push(s); });
      } else {
        db = normalize(d);
      }
      save(); render(); toast(`Imported ${d.topics.length} topics`);
    }catch(err){ toast('That file is not a valid Revise backup'); }
    e.target.value='';
  }
});
document.addEventListener('keydown', e => {

$('#themeBtn').onclick = () => {

/* ============ Focus (Pomodoro) ============ */
const TKEY = 'revise.timer';
const TIMER_BASE = {phase:'study', running:false, endAt:0, remaining:null, total:null, round:1, sessStart:0, subject:'', topicId:'', note:''};
let timer = loadTimer();
function loadTimer(){
  try{ return {...TIMER_BASE, ...JSON.parse(localStorage.getItem(TKEY)||'{}')}; }catch(e){ return {...TIMER_BASE}; }
}
function saveTimer(){ try{ localStorage.setItem(TKEY, JSON.stringify(timer)); }catch(e){} }
const phaseMin = p => p==='study' ? db.focus.study : p==='long' ? db.focus.longBrk : db.focus.brk;
const phaseName = p => p==='study' ? 'Focus' : p==='long' ? 'Long break' : 'Short break';
const isActive = () => timer.remaining != null; // a phase has been started (running or paused)
const totalMs = () => timer.total ?? phaseMin(timer.phase)*60000;
const remainingMs = () => timer.running ? Math.max(0, timer.endAt - Date.now()) : (timer.remaining ?? totalMs());
const clock = ms => { const s = Math.ceil(ms/1000); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; };
const fmtMin = m => { m = Math.round(m); return m < 60 ? `${m}m` : `${Math.floor(m/60)}h${m%60 ? ' '+(m%60)+'m' : ''}`; };
const hm = ts => new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

let audioCtx = null;
function chime(){
  if(!db.focus.sound) return;
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    [0, .25, .5].forEach((t, k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = [660, 880, 990][k]; o.type = 'sine';
      g.gain.setValueAtTime(.0001, audioCtx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+t+.4);
      o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+.45);
    });
  }catch(e){}
  try{ navigator.vibrate?.([200,100,200]); }catch(e){}
}

function startPause(){
  try{ audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
  if(timer.running){ // pause
    timer.remaining = Math.max(0, timer.endAt - Date.now()); timer.running = false;
  } else {
    if(!isActive()){ timer.total = phaseMin(timer.phase)*60000; timer.remaining = timer.total; }
    if(timer.phase==='study' && !timer.sessStart) timer.sessStart = Date.now();
    timer.endAt = Date.now() + timer.remaining; timer.running = true;
  }
  saveTimer(); updateTimerUI();
}
function studiedMs(){ return timer.phase==='study' && isActive() ? totalMs() - remainingMs() : 0; }
function recordSession(ms, end, completed){
  const minutes = Math.round(ms/60000);
  if(minutes < 1) return null;
  const t = timer.topicId && getTopic(timer.topicId);
  const s = { id:uid(), start: timer.sessStart || end - ms, end, minutes,
    subject: timer.subject.trim(), topicId: t ? t.id : '', topicTitle: t ? t.title : '', note: timer.note.trim(), completed };
  db.sessions.push(s); save();
  return s;
}
function setPhase(phase, autorun){
  timer.phase = phase; timer.total = phaseMin(phase)*60000;
  timer.sessStart = 0;
  if(autorun){ timer.remaining = timer.total; timer.endAt = Date.now()+timer.total; timer.running = true; if(phase==='study') timer.sessStart = Date.now(); }
  else { timer.remaining = null; timer.total = null; timer.running = false; }
  saveTimer();
}
// Called when the countdown reaches zero (also on load if it finished while the app was closed)
function finishPhase(at){
  const stale = Date.now() - at > 60000;
  const auto = db.focus.autoStart && !stale;
  if(timer.phase==='study'){
    const s = recordSession(totalMs(), at, true);
    const long = timer.round % db.focus.longEvery === 0;
    setPhase(long ? 'long' : 'break', auto);
    chime();
    notifyFocus('✅ Focus session done', `${s ? fmtMin(s.minutes)+' recorded. ' : ''}Time for a ${phaseMin(timer.phase)} min ${long?'long ':''}break.`);
  } else {
    timer.round = timer.phase==='long' ? 1 : timer.round + 1;
    setPhase('study', auto);
    chime();
    notifyFocus('⏰ Break is over', `Ready for ${db.focus.study} more minutes of focus?`);
  }
  if(tab==='focus') render(); else updateTimerUI();
}
function notifyFocus(title, body){
  if(document.visibilityState==='visible') toast(title + ' — ' + body);
  notify(title, body, 'revise-focus');
}
function skipPhase(){
  if(timer.phase==='study'){
    const ms = studiedMs();
    const s = ms >= 60000 ? recordSession(ms, Date.now(), false) : null;
    const long = timer.round % db.focus.longEvery === 0;
    setPhase(long ? 'long' : 'break', false);
    toast(s ? `Recorded ${fmtMin(s.minutes)} · break next` : 'Skipped to break');
  } else {
    timer.round = timer.phase==='long' ? 1 : timer.round + 1;
    setPhase('study', false);
    toast('Break skipped');
  }
  render();
}
function stopTimer(){
  const ms = studiedMs();
  if(ms >= 60000){
    const s = recordSession(ms, Date.now(), false);
    if(s) toast(`Stopped — ${fmtMin(s.minutes)} recorded`, () => { db.sessions = db.sessions.filter(x=>x.id!==s.id); save(); render(); });
  }
  timer.round = 1; setPhase('study', false); render();
}

function updateTimerUI(){
  const rem = remainingMs(), tot = totalMs();
  if(timer.running) document.title = `${clock(rem)} · ${phaseName(timer.phase)}`;
  const el = $('#tTime'); if(!el) return;
  el.textContent = clock(rem);
  $('#tPhase').textContent = phaseName(timer.phase) + (isActive() && !timer.running ? ' · paused' : '');
  const C = 2*Math.PI*110;
  $('#tProg').style.strokeDashoffset = C * (1 - rem/tot);
  $('#tRing').classList.toggle('brk', timer.phase!=='study');
  $('#tStart').textContent = timer.running ? '⏸ Pause' : isActive() ? '▶ Resume' : '▶ Start';
  $('#tStop').disabled = !isActive() && timer.round===1 && timer.phase==='study';
}

/* --- records filtering --- */
let recF = { q:'', subject:'', range:'7', sort:'new', selecting:false, sel:new Set() };
function filteredSessions(){
  let list = db.sessions.slice();
  if(recF.range !== 'all'){
    const from = recF.range==='today' ? today() : addDays(today(), -(+recF.range - 1));
    list = list.filter(s => ymd(new Date(s.start)) >= from);
  }
  if(recF.subject) list = list.filter(s => (s.subject||'') === (recF.subject==='__none' ? '' : recF.subject));
  const q = recF.q.trim().toLowerCase();
  if(q) list = list.filter(s => `${s.subject} ${s.topicTitle} ${s.note}`.toLowerCase().includes(q));
  const by = {
    new:(a,b)=>b.start-a.start, old:(a,b)=>a.start-b.start,
    long:(a,b)=>b.minutes-a.minutes, short:(a,b)=>a.minutes-b.minutes,
    subject:(a,b)=>(a.subject||'~').localeCompare(b.subject||'~') || b.start-a.start
  };
  return list.sort(by[recF.sort]);
}
function sessionSubjects(){ return [...new Set([...subjects(), ...db.sessions.map(s=>s.subject).filter(Boolean)])].sort((a,b)=>a.localeCompare(b)); }
function topicOptions(subject, selected){
  const pool = db.topics.filter(t => !t.archived || t.id===selected);
  const match = subject ? pool.filter(t => t.subject===subject) : [];
  const list = match.length ? match : pool;
  return `<option value="">— none —</option>` + list.map(t => `<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.title)}${!match.length && t.subject ? ' ('+esc(t.subject)+')' : ''}</option>`).join('');
}
const minutesOn = d => db.sessions.filter(s => ymd(new Date(s.start))===d).reduce((a,s)=>a+s.minutes, 0);

function renderFocus(){

  const subs = sessionSubjects();
  return `
  <div class="focus-grid">
    <div class="card timer">
      <div class="ring" id="tRing">
        <svg viewBox="0 0 240 240"><circle class="track" cx="120" cy="120" r="110"/><circle class="prog" id="tProg" cx="120" cy="120" r="110" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
        <div class="center"><div class="phase" id="tPhase"></div><div class="time" id="tTime"></div>
          <div class="rounds">${[...Array(f.longEvery)].map((_,k)=>`<i class="${k < timer.round - (timer.phase==='study'?1:0) ? 'on':''}"></i>`).join('')}</div></div>
      </div>
      <div class="ctrls">
        <button class="btn primary big" id="tStart" data-f="start"></button>
      </div>
      <div class="ctrls">
        <button class="btn" data-f="skip">⏭ ${timer.phase==='study'?'Skip to break':'Skip break'}</button>
        <button class="btn" id="tStop" data-f="stop">⏹ Stop</button>
      </div>
      <div style="width:100%">
        <label>Subject</label>
        <input type="text" id="fcSub" list="fcSubList" placeholder="What are you studying?" value="${esc(timer.subject)}">
        <datalist id="fcSubList">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
        <label>Topic (optional)</label>

      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><b>Today</b><small style="color:var(--muted)">🔥 ${streakD} day streak</small></div>
        <div class="row" style="margin-top:8px">
          <div><div style="font-size:24px;font-weight:700">${fmtMin(todayMin)}</div><small style="color:var(--muted)">focused · ${todayN} session${todayN===1?'':'s'}</small></div>
          <div><div style="font-size:24px;font-weight:700">${fmtMin(weekMin)}</div><small style="color:var(--muted)">last 7 days</small></div>

        <small style="color:var(--muted)">Daily goal: ${fmtMin(todayMin)} / ${fmtMin(f.goal)}${todayMin>=f.goal?' 🎉':''}</small>
        <div class="bars" style="height:70px">${mins.map((m,k)=>`<div style="height:${m/max*100}%;${days[k]===td?'':'opacity:.55'}" title="${fmt(days[k])}: ${fmtMin(m)}"></div>`).join('')}</div>

        <div class="switch"><span>Sound &amp; vibration when time's up</span><input type="checkbox" id="fSound" ${f.sound?'checked':''}></div>
        ${isActive() ? '<p style="font-size:12px;color:var(--muted);margin:6px 0 0">New lengths apply from the next session.</p>' : ''}
      </div>

    <button class="btn small" data-f="csv">⬇ CSV</button>
  </div>
  <div class="toolbar">
    <input type="search" id="rq" placeholder="Search subject, topic, note…" value="${esc(recF.q)}">
    <select id="rSub"><option value="">All subjects</option><option value="__none" ${recF.subject==='__none'?'selected':''}>No subject</option>${subs.map(s=>`<option ${s===recF.subject?'selected':''}>${esc(s)}</option>`).join('')}</select>
    <select id="rRange">${[['today','Today'],['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days'],['all','All time']].map(([v,l])=>`<option value="${v}" ${v===recF.range?'selected':''}>${l}</option>`).join('')}</select>
    <select id="rSort">${[['new','Newest first'],['old','Oldest first'],['long','Longest first'],['short','Shortest first'],['subject','By subject']].map(([v,l])=>`<option value="${v}" ${v===recF.sort?'selected':''}>${l}</option>`).join('')}</select>
  </div>
  <div id="recWrap">${renderRecords()}</div>`;
}
function renderRecords(){
  const list = filteredSessions();
  if(!db.sessions.length) return `<div class="card empty">No study sessions yet. Start the timer — every focus session is saved here automatically.</div>`;
  if(!list.length) return `<div class="card empty">No records match these filters.</div>`;
  const total = list.reduce((a,s)=>a+s.minutes,0);
  // per-subject breakdown
  const bySub = {}; list.forEach(s => { const k = s.subject || 'No subject'; bySub[k] = (bySub[k]||0) + s.minutes; });
  const subRows = Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
  let html = `<div class="card" style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${list.length} session${list.length>1?'s':''} · ${fmtMin(total)}</b><small style="color:var(--muted)">avg ${fmtMin(total/list.length)}</small></div>
    <div style="display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;background:var(--line)">${subRows.map(([k,m])=>`<div title="${esc(k)}: ${fmtMin(m)}" style="flex:${m};background:${k==='No subject'?'var(--muted)':subjectColor(k)}"></div>`).join('')}</div>
    <div class="meta" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${subRows.map(([k,m])=>`<span class="chip"><span class="dot" style="background:${k==='No subject'?'var(--muted)':subjectColor(k)}"></span>${esc(k)} · ${fmtMin(m)}</span>`).join('')}</div>
  </div>`;
  if(recF.selecting){
    const all = list.every(s=>recF.sel.has(s.id));
    html += `<div class="selbar"><span class="t"><b>${recF.sel.size}</b> selected</span>
      <button class="btn small" data-f="selAll">${all?'Clear':'Select all'}</button>
      <button class="btn small danger" data-f="delSel" ${recF.sel.size?'':'disabled'}>🗑 Delete</button></div>`;
  }
  const row = s => {
    const st = s.manual ? '✍️ Added manually' : s.completed ? '✓ Completed' : '⏹ Stopped early';
    return `<div class="rec">
      ${recF.selecting ? `<input type="checkbox" data-sel="${s.id}" ${recF.sel.has(s.id)?'checked':''}>` : ''}
      <div class="body">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${s.subject ? chip(s.subject) : '<span class="chip">No subject</span>'}${s.topicTitle?`<b style="font-size:14px">${esc(s.topicTitle)}</b>`:''}</div>
        ${s.note ? `<div style="font-size:13px;margin-top:3px;word-break:break-word">${esc(s.note)}</div>` : ''}
        <div class="tm">${recF.sort==='new'||recF.sort==='old' ? '' : fmt(ymd(new Date(s.start)))+' · '}${hm(s.start)}–${hm(s.end)} · ${st}</div>
      </div>
      <div class="dur">${fmtMin(s.minutes)}</div>
      ${recF.selecting ? '' : `<button class="icon-btn" data-f="edit" data-id="${s.id}" title="Edit">✏️</button><button class="icon-btn" data-f="del" data-id="${s.id}" title="Delete">🗑️</button>`}
    </div>`;
  };
  if(recF.sort==='new' || recF.sort==='old'){
    const groups = []; list.forEach(s => { const k = ymd(new Date(s.start)); const g = groups.at(-1); if(g && g.k===k) g.items.push(s); else groups.push({k, items:[s]}); });
    html += groups.map(g => `<div class="day-h"><span>${g.k===today()?'Today':g.k===addDays(today(),-1)?'Yesterday':fmtLong(g.k)}</span><small>${fmtMin(g.items.reduce((a,s)=>a+s.minutes,0))}</small></div>
      <div class="card recs">${g.items.map(row).join('')}</div>`).join('');
  } else {
    html += `<div class="card recs">${list.map(row).join('')}</div>`;
  }
  return html;
}
function refreshRecords(){ const w = $('#recWrap'); if(w) w.innerHTML = renderRecords(); }

function deleteSessions(ids){
  const set = new Set(ids);
  const removed = db.sessions.filter(s => set.has(s.id));
  db.sessions = db.sessions.filter(s => !set.has(s.id));
  ids.forEach(id => recF.sel.delete(id));
  save(); if(tab==='focus') render();
  toast(`Deleted ${removed.length} record${removed.length>1?'s':''}`, () => { db.sessions.push(...removed); save(); if(tab==='focus') render(); });
}
function editSession(id){
  const s = id ? db.sessions.find(x=>x.id===id) : null;
  const st = new Date(s ? s.start : Date.now() - 25*60000);
  openModal(`<h3>${s?'Edit study record':'Add study record'}</h3>
    <div class="row">
      <div><label>Date</label><input type="date" id="sDate" value="${ymd(st)}"></div>
      <div><label>Start time</label><input type="time" id="sStart" value="${pad(st.getHours())}:${pad(st.getMinutes())}"></div>
    </div>
    <label>Minutes studied</label>
    <div class="num"><input type="number" id="sMin" min="1" max="1440" value="${s?.minutes ?? db.focus.study}" style="width:100px"><span>minutes</span></div>
    <label>Subject</label>
    <input type="text" id="sSub" list="sSubList" value="${esc(s?.subject||'')}" placeholder="e.g. Biology">
    <datalist id="sSubList">${sessionSubjects().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <label>Topic (optional)</label>
    <select id="sTopic">${topicOptions(s?.subject||'', s?.topicId||'')}</select>
    <label>Note</label>
    <input type="text" id="sNote" value="${esc(s?.note||'')}" placeholder="What did you work on?">
    <div class="foot">
      ${s?`<button class="btn danger" data-f="delOne" data-id="${s.id}">Delete</button>`:''}
      <button class="btn" data-m="cancel">Cancel</button>
      <button class="btn primary" data-f="saveSess" data-id="${s?.id||''}">${s?'Save':'Add record'}</button>
    </div>`);
}
function saveSession(id){
  const min = Math.round(+$('#sMin').value);
  if(!(min >= 1 && min <= 1440)){ toast('Minutes must be between 1 and 1440'); return; }
  const [y,mo,da] = ($('#sDate').value || today()).split('-').map(Number);
  const [h,mi] = ($('#sStart').value || '00:00').split(':').map(Number);
  const start = new Date(y, mo-1, da, h, mi).getTime();
  const topicId = $('#sTopic').value; const t = topicId && getTopic(topicId);
  const data = { start, end:start+min*60000, minutes:min, subject:$('#sSub').value.trim(), topicId: t?t.id:'', topicTitle: t?t.title:'', note:$('#sNote').value.trim() };
  if(id){ Object.assign(db.sessions.find(x=>x.id===id), data); toast('Record updated'); }
  else { db.sessions.push({ id:uid(), completed:false, manual:true, ...data }); toast('Record added'); }
  save(); closeModal(); render();
}
function exportCsv(){
  const list = filteredSessions();
  if(!list.length){ toast('No records to export'); return; }
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = [['Date','Start','End','Minutes','Subject','Topic','Note','Status']]
    .concat(list.map(s => [ymd(new Date(s.start)), hm(s.start), hm(s.end), s.minutes, s.subject, s.topicTitle, s.note, s.manual?'Manual':s.completed?'Completed':'Stopped early']));
  download(`study-records-${today()}.csv`, '﻿' + rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-f]'); if(!el) return;
  const d = el.dataset, f = db.focus;
  if(d.f==='start') startPause();
  if(d.f==='skip') skipPhase();
  if(d.f==='stop') stopTimer();
  if(d.f==='preset'){ f[d.k] = +d.v; save(); render(); }
  if(d.f==='add') editSession();
  if(d.f==='edit') editSession(d.id);
  if(d.f==='saveSess') saveSession(d.id);
  if(d.f==='del') deleteSessions([d.id]);
  if(d.f==='delOne'){ closeModal(); deleteSessions([d.id]); }
  if(d.f==='csv') exportCsv();
  if(d.f==='select'){ recF.selecting = !recF.selecting; recF.sel.clear(); render(); }
  if(d.f==='selAll'){ const l = filteredSessions(); const all = l.every(s=>recF.sel.has(s.id)); l.forEach(s => all ? recF.sel.delete(s.id) : recF.sel.add(s.id)); refreshRecords(); }
  if(d.f==='delSel' && recF.sel.size && confirm(`Delete ${recF.sel.size} record${recF.sel.size>1?'s':''}?`)){ deleteSessions([...recF.sel]); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if(id==='fcSub'){ timer.subject = e.target.value; saveTimer(); $('#fcTopic').innerHTML = topicOptions(timer.subject.trim(), timer.topicId); }
  if(id==='fcNote'){ timer.note = e.target.value; saveTimer(); }
  if(id==='sSub'){ const cur = $('#sTopic').value; $('#sTopic').innerHTML = topicOptions(e.target.value.trim(), cur); }
  if(id==='rq'){ recF.q = e.target.value; refreshRecords(); }
});
document.addEventListener('change', e => {
  const id = e.target.id, f = db.focus, v = Math.round(+e.target.value);
  const clampSet = (k, lo, hi) => { if(v >= lo && v <= hi){ f[k] = v; save(); render(); } else { toast(`Enter a number from ${lo} to ${hi}`); render(); } };
  if(id==='fStudy') clampSet('study', 1, 240);
  if(id==='fBrk') clampSet('brk', 1, 120);
  if(id==='fLong') clampSet('longBrk', 1, 120);
  if(id==='fEvery') clampSet('longEvery', 1, 12);
  if(id==='fGoal') clampSet('goal', 5, 1440);
  if(id==='fAuto'){ f.autoStart = e.target.checked; save(); }
  if(id==='fSound'){ f.sound = e.target.checked; save(); if(f.sound) chime(); }
  if(id==='fcTopic'){
    timer.topicId = e.target.value; const t = getTopic(timer.topicId);
    if(t && !timer.subject.trim() && t.subject){ timer.subject = t.subject; $('#fcSub').value = t.subject; }
    saveTimer();
  }
  if(id==='sTopic'){ const t = getTopic(e.target.value); if(t && !$('#sSub').value.trim()) $('#sSub').value = t.subject||''; }
  if(id==='rSub'){ recF.subject = e.target.value; refreshRecords(); }
  if(id==='rRange'){ recF.range = e.target.value; refreshRecords(); }
  if(id==='rSort'){ recF.sort = e.target.value; refreshRecords(); }
  if(e.target.dataset.sel){ const s = e.target.dataset.sel; e.target.checked ? recF.sel.add(s) : recF.sel.delete(s); refreshRecords(); }
});
// Timer heartbeat
let wasRunning = timer.running;
setInterval(() => {
  if(timer.running && Date.now() >= timer.endAt) finishPhase(timer.endAt);
  updateTimerUI();
  if(wasRunning && !timer.running) updateBadge();
  wasRunning = timer.running;
}, 500);
if(timer.running && Date.now() >= timer.endAt) setTimeout(() => finishPhase(timer.endAt), 0);

/* ============ PWA ============ */
let deferredInstall = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; const b=$('#installBtn'); if(b) b.classList.remove('hidden'); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; registerPeriodic(); syncToSW(); }).catch(()=>{});
}
// Re-check when the app comes back to the foreground, and every minute while open
document.addEventListener('visibilitychange', () => { if(!document.hidden){ render(); checkReminder(); } });
let lastDay = today();
setInterval(() => { if(today()!==lastDay){ lastDay=today(); render(); } checkReminder(); }, 60000);

applyTheme();
render();
setTimeout(checkReminder, 1500);
</script>
</body>
</html>
